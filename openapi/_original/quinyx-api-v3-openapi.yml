                  pattern: ^[0-9]+$
                - type: string
                  description: >-
                    The external string ID, which must start with
                    'badgeNumber:'.
                  example: badgeNumber:example-external-id
                  pattern: ^badgeNumber:[a-zA-Z0-9._-]{1,64}$
            maxItems: 50
        - name: beginGte
          in: query
          description: Filter by begin (GTE)
          schema:
            type: string
            format: date-time
        - name: beginLte
          in: query
          description: Filter by begin (LTE)
