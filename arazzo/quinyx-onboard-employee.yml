arazzo: 1.0.1
info:
  title: Onboard an employee in Quinyx
  version: 1.0.0
  summary: Create an organizational group, create an employee, and assign a role using the Quinyx API v3.
  x-realizes-capability-ids:
  - BC-300.70
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-300.70
      capability_name: HR Operations Management
      spec: quinyx-employee-api-openapi.yml
      confidence: 0.85
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: employeeApi
  url: ../openapi/quinyx-employee-api-openapi.yml
  type: openapi
- name: groupApi
  url: ../openapi/quinyx-group-api-openapi.yml
  type: openapi
- name: roleAssignmentApi
  url: ../openapi/quinyx-role-assignment-api-openapi.yml
  type: openapi
workflows:
- workflowId: onboardEmployee
  summary: Create a group, an employee, and a role assignment.
  inputs:
    type: object
    properties:
      groupName: {type: string}
      employee: {type: object}
      roleId: {type: string}
  steps:
  - stepId: createGroup
    operationId: createGroup
    requestBody:
      payload:
        name: $inputs.groupName
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      groupId: $response.body#/id
  - stepId: createEmployee
    operationId: createEmployee
    requestBody:
      payload: $inputs.employee
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      employeeId: $response.body#/id
  - stepId: createRoleAssignment
    operationId: createRoleAssignment
    requestBody:
      payload:
        employeeId: $steps.createEmployee.outputs.employeeId
        groupId: $steps.createGroup.outputs.groupId
        roleId: $inputs.roleId
    successCriteria:
    - condition: $statusCode == 201
  outputs:
    employeeId: $steps.createEmployee.outputs.employeeId
