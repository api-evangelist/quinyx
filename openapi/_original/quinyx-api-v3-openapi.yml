  /schedule/v3/shifts:
    get:
      summary: List shifts
      description: >
        Returns shifts using cursor-based pagination.


        Supports:

        - Numeric internal IDs

        - External IDs using prefix 'xrefId:'

        - Employee badge numbers using prefix 'badgeNumber:'

        - Timezone override via Prefer header


        Pagination is cursor-based. Use the returned pageToken for next/previous
        navigation.
      operationId: getShifts
      parameters:
        - name: Prefer
          in: header
          description: |
            Optional header for response formatting.

            Example:
            Prefer: timezone=Europe/Belgrade

            Affects only response date-time values.
            Does NOT affect filtering parameters.

            Default response timezone is UTC.
          required: false
          schema:
            type: string
          example: timezone=Europe/Belgrade
        - name: pageToken
          in: query
          description: Cursor for the next page of results.
          required: false
          schema:
            type: string
            example: eyJpZCI6MTAwfQ
        - name: pageSize
          in: query
          description: Maximum number of items to return.
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            example: 50
            maximum: 100
            minimum: 1
        - name: idIn
          in: query
          description: 'Filter by id (IN). Supports external ids of types: xrefId'
          style: form
          explode: true
          schema:
            type: array
            description: Multiple values for id with operator IN
            items:
              description: >-
                An identifier that can be either a Quinyx ID or a prefixed
                external ID string.
              oneOf:
                - type: string
                  description: The Quinyx ID of the resource.
                  pattern: ^[0-9]+$
                - type: string
                  description: The external string ID, which must start with 'xrefId:'.
                  example: xrefId:example-external-id
                  pattern: ^xrefId:[a-zA-Z0-9._-]{1,64}$
            maxItems: 50
        - name: groupIdIn
          in: query
          description: 'Filter by groupId (IN). Supports external ids of types: xrefId'
          style: form
          explode: true
          schema:
            type: array
            description: Multiple values for groupId with operator IN
            items:
