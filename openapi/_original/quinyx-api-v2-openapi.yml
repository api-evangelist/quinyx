      type: object
      description: >-
        Represents a custom field with key-value pair for additional tag
        properties
      properties:
        label:
          type: string
          description: Label of the custom field
          example: Phone number
          maxLength: 50
          minLength: 0
        value:
          type: string
          description: Value of the custom field
          example: '+46701234567'
          maxLength: 255
          minLength: 0
      required:
        - label
        - value
    tags_Period:
      type: object
      description: Represents an operating period for a tag, defining when it is active
      properties:
        from:
          type: string
          format: date
          description: Start date of the period
          example: '2022-01-01'
        to:
          type: string
          format: date
          description: End date of the period
          example: '2022-01-31'
        hours:
          type: number
          format: float
          description: Number of hours for this period
          example: 8
        type:
          type: string
          description: Type of period
          enum:
            - PERIOD
            - DAYS
            - WEEKS
          example: DAYS
        count:
          type: number
          format: float
          description: Number of periods
          example: 1
      required:
        - count
        - from
        - hours
        - type
    tags_TagIntegration:
      type: object
      description: Represents a tag with integration-specific properties
      properties:
        unitExternalId:
          type: string
          description: External identifier of the unit this tag is associated with
          example: UNIT-001
        categoryExternalId:
          type: string
          description: External identifier of the category this tag belongs to
          example: LOC-001
        name:
          type: string
          description: Name of the tag
          example: Downtown Store
          maxLength: 255
          minLength: 0
        code:
          type: string
          description: Code identifier for the tag
          example: DT-001
          maxLength: 50
          minLength: 0
        externalId:
          type: string
          description: External identifier for integration purposes
          example: store-123
          maxLength: 60
          minLength: 0
        information:
          type: string
          description: Additional information about the tag
          example: Main downtown location with parking
          maxLength: 2000
          minLength: 0
        uniqueScheduling:
          type: boolean
          description: Indicates if this tag requires unique scheduling
          example: true
        startDate:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Start date for tag validity. If set, tag start date must be between
            '1970-01-02' and '2038-01-19' (inclusive)
          example: '2024-01-01'
        endDate:
          type:
            - string
            - 'null'
          format: date
          description: >-
            End date for tag validity. If set, tag end date must be between
            '1970-01-02' and '2038-01-19' (inclusive)
          example: '2024-12-31'
        periods:
          type: array
          description: Operating periods for this tag
          example:
            - from: '2022-01-01'
              to: '2022-01-31'
              hours: 8
              type: DAYS
              count: 1
          items:
            $ref: '#/components/schemas/tags_Period'
        coordinates:
          type: array
          description: Geographic coordinates associated with this tag
          example:
            - latitude: 59.334591
              longitude: 18.06324
              name: Stockholm Mall
              radius: 100
          items:
            $ref: '#/components/schemas/tags_Coordinate'
        customFields:
          type: array
          description: Custom fields for additional tag properties
          example:
            - label: phoneNumber
              value: '+46123456789'
          items:
            $ref: '#/components/schemas/tags_CustomField'
      required:
        - categoryExternalId
        - name
        - unitExternalId
