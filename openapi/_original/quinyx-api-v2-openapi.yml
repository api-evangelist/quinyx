openapi: 3.1.0
info:
  title: Quinyx API
  version: v2
  x-service: absence-schedule
  description: null
tags:
  - name: Authentication
    x-displayName: Authentication
  - name: Absence Schedules
    x-displayName: Absence Schedules
  - name: Absence Types
    x-displayName: Absence Types
  - name: Absences
    x-displayName: Absences
  - name: Agreements
    x-displayName: Agreements
  - name: AI Scheduled Headcount
    x-displayName: AI Scheduled Headcount
  - name: Collaboration Groups
    x-displayName: Collaboration Groups
  - name: Collaboration Groups Labels
    x-displayName: Collaboration Groups Labels
  - name: Employees
    x-displayName: Employees
  - name: Forecast Data
    x-displayName: Forecast Data
  - name: Forecast Dynamic Rules
    x-displayName: Forecast Dynamic Rules
  - name: Forecast Event Categories
    x-displayName: Forecast Event Categories
  - name: Forecast Event Effects
    x-displayName: Forecast Event Effects
  - name: Forecast Events
    x-displayName: Forecast Events
  - name: Forecast Optimal Headcounts
    x-displayName: Forecast Optimal Headcounts
  - name: Forecast Static Rules
    x-displayName: Forecast Static Rules
  - name: Forecast Target Data
    x-displayName: Forecast Target Data
  - name: Group Locations
    x-displayName: Group Locations
  - name: Groups
    x-displayName: Groups
  - name: Labor Standards
    x-displayName: Labor Standards
  - name: Mappings
    x-displayName: Mappings
  - name: Opening Hours
    x-displayName: Opening Hours
  - name: Pay Schedules
    x-displayName: Pay Schedules
  - name: Schedule Availability
    x-displayName: Schedule Availability
  - name: Standard Variables
    x-displayName: Standard Variables
  - name: Tags
    x-displayName: Tags
paths:
  /v2/absence-schedule/groups/{groupId}:
    get:
      tags:
        - Absence Schedules
      summary: List absence schedules for group
      operationId: getAbsenceSchedules
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Response where you see the absence schedules for group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/absence-schedule_IntegrationAbsenceSchedule
        '400':
          description: |
            In case you send groupId which is not domain groupId.
            Or if groupId is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/absence-schedule_ValidationError'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      x-audience: public
  /v2/absence-types/groups/{groupId}/employees/{employeeId}:
    get:
      tags:
        - Absence Types
      summary: List absence types for group and employee in period
      operationId: getAbsenceTypesForEmployee
      parameters:
        - name: groupId
          in: path
          description: >-
            ID of the domain group. Any other group type (e.g. district, unit or
            section) is rejected with a 400 error.
          required: true
          schema:
            type: integer
            format: int32
          example: 170300
        - name: employeeId
          in: path
          description: ID of the employee
          required: true
          schema:
            type: integer
            format: int32
          example: 608414
        - name: start
          in: query
          description: Start date of the period (yyyy-MM-dd)
          required: true
          schema:
            type: string
            format: date
          example: '2026-07-01'
        - name: end
          in: query
          description: End date of the period (yyyy-MM-dd)
          required: true
          schema:
            type: string
            format: date
          example: '2026-07-31'
      responses:
        '200':
          description: >-
            Response where you see the absence types for group and employee in
            period
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/absence-types_IntegrationAbsenceType'
        '400':
          description: |
            In case you send groupId which is not domain groupId.
            Or if any of groupId, employeeId, start, end is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/absence-types_ValidationError'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      x-audience: public
  /v2/collaboration-groups/labels/{labelId}:
    get:
      tags:
        - Collaboration Groups Labels
      summary: Get label by id
      operationId: getLabelsById
      parameters:
        - name: labelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collaboration-groups_Label'
      x-audience: public
    put:
      tags:
        - Collaboration Groups Labels
      summary: Update label
      operationId: updateLabel
      parameters:
        - name: labelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collaboration-groups_LabelUpdate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collaboration-groups_Label'
      x-audience: public
    delete:
      tags:
        - Collaboration Groups Labels
      summary: Delete label
      operationId: deleteLabel
      parameters:
        - name: labelId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
      x-audience: public
  /v2/collaboration-groups/groups/{collaborationGroupId}:
    get:
      tags:
        - Collaboration Groups
      summary: Get collaboration group by id
      operationId: getCollaborationGroupsById
      parameters:
        - name: collaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/collaboration-groups_CollaborationGroupDetails
      x-audience: public
    put:
      tags:
        - Collaboration Groups
      summary: Update collaboration group
      operationId: editCollaborationGroups
      parameters:
        - name: collaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/collaboration-groups_CollaborationGroupUpdate
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collaboration-groups_CollaborationGroup'
      x-audience: public
    delete:
      tags:
        - Collaboration Groups
      summary: Delete collaboration group with its children
      operationId: deleteCollaborationGroupsWithChildren
      parameters:
        - name: collaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
      x-audience: public
  /v2/collaboration-groups/groups/{collaborationGroupId}/unarchive:
    put:
      tags:
        - Collaboration Groups
      summary: Unarchive collaboration group
      operationId: unArchiveCollaborationGroup
      parameters:
        - name: collaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
      x-audience: public
  /v2/collaboration-groups/groups/{collaborationGroupId}/move:
    put:
      tags:
        - Collaboration Groups
      summary: Move a collaboration group to a new parent
      operationId: moveCollaborationGroup
      parameters:
        - name: collaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collaboration-groups_CollaborationGroupMove'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collaboration-groups_CollaborationGroup'
      x-audience: public
  /v2/collaboration-groups/groups/{collaborationGroupId}/archive:
    put:
      tags:
        - Collaboration Groups
      summary: Archive collaboration group
      operationId: archiveCollaborationGroup
      parameters:
        - name: collaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
      x-audience: public
  /v2/collaboration-groups/labels:
    post:
      tags:
        - Collaboration Groups Labels
      summary: Create label for domain
      operationId: createLabel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collaboration-groups_LabelCreate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collaboration-groups_Label'
      x-audience: public
  /v2/collaboration-groups/groups:
    post:
      tags:
        - Collaboration Groups
      summary: Create collaboration group for domain
      operationId: createCollaborationGroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/collaboration-groups_CollaborationGroupCreate
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collaboration-groups_CollaborationGroup'
      x-audience: public
  /v2/collaboration-groups/associate-groups:
    post:
      tags:
        - Collaboration Groups
      summary: Associate groups to a collaboration group
      operationId: associateGroupsToCollaborationGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/collaboration-groups_CollaborationGroupGroupDTO
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/collaboration-groups_CollaborationGroupGroup
      x-audience: public
  /v2/collaboration-groups/associate-employees:
    post:
      tags:
        - Collaboration Groups
      summary: Associate employees to a collaboration group
      operationId: associateEmployeesToCollaborationGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/collaboration-groups_CollaborationGroupEmployeeDTO
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/collaboration-groups_CollaborationGroupEmployee
      x-audience: public
  /v2/collaboration-groups/root-by-domain/{domainId}:
    get:
      tags:
        - Collaboration Groups
      summary: Get root collaboration group by domain id
      operationId: getRootCollaborationGroupsByDomain
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/collaboration-groups_CollaborationGroupDetails
      x-audience: public
  /v2/collaboration-groups/labels/domain/{domainId}:
    get:
      tags:
        - Collaboration Groups Labels
      summary: List labels by domain
      operationId: getLabelsByDomain
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/collaboration-groups_Label'
      x-audience: public
  /v2/collaboration-groups/groups/{rootGroupId}/all-under-root:
    get:
      tags:
        - Collaboration Groups
      summary: List collaboration groups under root
      operationId: getAllCollaborationGroupsUnderRoot
      parameters:
        - name: rootGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/collaboration-groups_CollaborationGroupDetails
      x-audience: public
  /v2/collaboration-groups/groups/{parentId}/children:
    get:
      tags:
        - Collaboration Groups
      summary: List child collaboration groups
      operationId: getChildrenGroups
      parameters:
        - name: parentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/collaboration-groups_CollaborationGroupDetails
      x-audience: public
  /v2/collaboration-groups/groups/{collaborationGroupId}/employees:
    get:
      tags:
        - Collaboration Groups
      summary: List employee ids in collaboration group
      operationId: getCollaborationGroupEmployeeIds
      parameters:
        - name: collaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int32
      x-audience: public
  /v2/collaboration-groups/groups/{collaborationGroupId}/eligible-parents:
    get:
      tags:
        - Collaboration Groups
      summary: List eligible parent collaboration groups
      operationId: getEligibleParentCollaborationGroups
      parameters:
        - name: collaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/collaboration-groups_CollaborationGroup'
      x-audience: public
  /v2/collaboration-groups/groups/group/{groupId}:
    get:
      tags:
        - Collaboration Groups
      summary: List collaboration groups for group
      operationId: getCollaborationGroupsByEmployeeGroupId
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/collaboration-groups_CollaborationGroupDetails
      x-audience: public
  /v2/collaboration-groups/groups/employee/{employeeId}:
    get:
      tags:
        - Collaboration Groups
      summary: List collaboration groups for employee
      operationId: getCollaborationGroupsByEmployeeId
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/collaboration-groups_CollaborationGroupDetails
      x-audience: public
  /v2/collaboration-groups/by-root/{rootCollaborationGroupId}/employee/{employeeId}:
    get:
      tags:
        - Collaboration Groups
      summary: Get collaboration group by root id and employee id
      operationId: getCollaborationGroupByRootIdAndEmployeeId
      parameters:
        - name: rootCollaborationGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/collaboration-groups_CollaborationGroupDetails
      x-audience: public
  /v2/collaboration-groups/delete-groups:
    delete:
      tags:
        - Collaboration Groups
      summary: >-
        Remove groups from a collaboration group, optionally including archived
        collaboration groups
      operationId: deleteGroupsFromCollaborationGroup
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/collaboration-groups_CollaborationGroupGroupDTO
        required: true
      responses:
        '200':
          description: OK
      x-audience: public
  /v2/collaboration-groups/delete-employees:
    delete:
      tags:
        - Collaboration Groups
      summary: >-
        Remove employees from a collaboration group, optionally including
        archived collaboration groups
      operationId: deleteEmployeesFromCollaborationGroup
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/collaboration-groups_CollaborationGroupEmployeeDTO
        required: true
      responses:
        '200':
          description: OK
      x-audience: public
  /v2/employee/agreements/{id}:
    patch:
      tags:
        - Agreements
      summary: Partially update an existing agreement
      operationId: patchAgreement
      parameters:
        - name: agreementRestId
          in: query
          description: Agreement identifier
          required: true
          schema:
            description: >-
              An identifier that can be either a Quinyx ID or a prefixed
              external ID string.
            oneOf:
              - type: string
                description: The Quinyx ID of the resource.
                pattern: ^[0-9]+$
              - type: string
                description: The external string ID, which must start with 'xrefId:'.
                example: xrefId:1234
                pattern: ^xrefId:[a-zA-Z0-9._-]{1,64}$
          examples:
            internal-id:
              summary: Internal ID
              description: Internal ID (Integer)
              value: 9
            external-id:
              summary: External ID
              description: >-
                External ID prefixed with 'xrefId:', 1-64 characters long,
                consisting of alphanumerics and . _ -
              value: xrefId:my-external-id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/employee_AgreementPatchRequest'
        required: true
      responses:
        '200':
          description: Agreement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/employee_AgreementResponse'
        '401':
          description: Unauthorized. Missing Bearer token.
        '403':
          description: 'Forbidden. Missing permission: agreement:update'
        '404':
          description: Agreement or credential's customer are not found.
      x-audience: public
  /v2/employee/pay-schedules/{id}/periods/{periodDate}:
    get:
      tags:
        - Pay Schedules
      summary: Get most recent pay period ending before date
      operationId: getPayPeriod
      parameters:
        - name: payScheduleRestId
          in: query
          description: Pay Schedule identifier
          required: true
          schema:
            type: string
          examples:
            internal-id:
              summary: Internal ID
              description: Internal ID (Integer)
              value: 9
            external-id:
              summary: External ID
              description: >-
                External ID prefixed with 'xrefId:', 1-64 characters long,
                consisting of alphanumerics and . _ -
              value: xrefId:my-external-id
        - name: periodDate
          in: path
          description: >-
            Returned period will be the most recent one that ended before this
            date. Usually: current date. Format: YYYY-MM-DD.
          required: true
          schema:
            type: string
            format: date
          example: '2026-02-10'
      responses:
        '200':
          description: >-
            Previous pay period along with list of allowed employees and unit
            IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/employee_IntegrationPayPeriodResponse'
        '401':
          description: Unauthorized. Missing Bearer token.
        '403':
          description: 'Forbidden. Missing permission: pay_schedules:read'
        '404':
          description: Pay schedule, or credential's customer is not found
      x-audience: public
  /v2/employee/badgeNo/{badgeNo}:
    get:
      tags:
        - Employees
      summary: Get List of employee information by badge number
      operationId: findEmployeesByBadgeNumber
      parameters:
        - name: badgeNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response employee details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/employee_EmployeeIntegrationResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      x-audience: public
  /v2/forecast-calculation/groups/{groupId}/optimal-headcounts/{optimalHeadcountId}:
    post:
      tags:
        - Forecast Optimal Headcounts
      summary: Calculate optimal headcount by id
      operationId: calculateOptimalHeadcountsById
      parameters:
        - name: optimalHeadcountId
          in: path
          required: true
          schema:
            type: string
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/forecast-calculation_OptimalHeadcountDatasetIntegrationRequest
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: >-
                  #/components/schemas/forecast-calculation_CalculatedDatasetResponse
      x-audience: public
  /v2/forecast-calculation/customer/{customerId}/events:
    post:
      tags:
        - Forecast Event Effects
      summary: Calculate event effects for a customer
      operationId: getEvents
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/forecast-calculation_CalculateEventEffectsRequest
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/forecast-calculation_Event'
      x-audience: public
  /v2/forecast-calculation/groups/{groupId}/optimal-headcounts:
    get:
      tags:
        - Forecast Optimal Headcounts
      summary: Calculate optimal headcounts for group, excluding limit rules
      operationId: calculateOptimalHeadcounts
      parameters:
        - name: startTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/forecast-calculation_OptimalHeadcountDatasetByGroupResponse
      x-audience: public
  /v2/forecasts/static-rules:
    get:
      tags:
        - Forecast Static Rules
      summary: List static rules
      operationId: getStaticRulesByGroup
      parameters:
        - name: externalUnitId
          in: query
          required: true
          schema:
            type: string
        - name: externalSectionId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
            maximum: 5000
            minimum: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 200
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/forecast-data-ingestion_PaginatedResultListExternalStaticRule
        '403':
          description: Forbidden to perform this action
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/forecast-data-ingestion_PaginatedResultListExternalStaticRule
      x-audience: public
