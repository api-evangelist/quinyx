      properties:
        error:
          type: string
          description: An error code defined in RFC 6749 or other extensions
          example: invalid_client
        error_description:
          type: string
          description: >-
            A short description of what caused this error. Sometimes this
            contains dynamically-generated information about your specific
            error.
          example: 'Client not found: my-client-id'
    rest-api-uaa_OAuth2TokenResponse:
      type: object
      description: OAuth2 token response
      properties:
        access_token:
          type: string
          description: The access token
          example: eyJhbGciOiJSUzI1NiJ9...
          minLength: 1
        token_type:
          type: string
          description: Token type
          example: Bearer
          minLength: 1
        expires_in:
          type: integer
          format: int64
          description: Token validity in seconds
          example: 3600
        scope:
          type: string
          description: Granted scope
          example: organization:groups:read organization:groups:create
          minLength: 1
      required:
        - access_token
        - expires_in
        - scope
        - token_type
