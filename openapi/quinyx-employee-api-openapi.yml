components:
  schemas:
    employee_UpdateEmergencyContact:
      type: object
      properties:
        nextOfKinName:
          type: string
          description: Name of the employee's next of kin
          example: John Doe
          maxLength: 50
          minLength: 0
        nextOfKinPhone:
          type: string
          description: Phone number of the employee's next of kin
          example: '+46700000000'
          maxLength: 20
          minLength: 0
        legalGuardianName:
          type: string
          description: Name of the employee's legal guardian
          example: Jane Doe
          maxLength: 50
          minLength: 0
        legalGuardianEmail:
          type: string
          description: Email address of the employee's legal guardian
          example: guardian@example.com
          maxLength: 50
          minLength: 0
      required:
      - legalGuardianEmail
      - legalGuardianName
      - nextOfKinName
      - nextOfKinPhone
    employee_CursorPaginationInfo:
      type: object
      description: Pagination information for cursor-based pagination.
      properties:
        nextPageToken:
          type: string
          description: The token for the next page
          example: eyJpZCI6MTIwfQ
        previousPageToken:
          type: string
          description: The token for the previous page
          example: eyJpZCI6ODB9
    employee_IntegrationEmployeeCreateRequest:
      type: object
      properties:
        badgeNumber:
          type: string
          description: Unique badge number identifying the employee
          example: '001'
          maxLength: 20
          minLength: 0
        email:
          type: string
          format: email
          description: Employee email address
          example: employee@example.com
          maxLength: 255
          minLength: 0
        personalInformation:
          $ref: '#/components/schemas/employee_CreatePersonalInformation'
        contactInformation:
          $ref: '#/components/schemas/employee_ContactInformation'
        address:
          $ref: '#/components/schemas/employee_Address'
        employment:
          $ref: '#/components/schemas/employee_CreateEmployment'
        emergencyContact:
          $ref: '#/components/schemas/employee_EmergencyContact'
        punchSettings:
          $ref: '#/components/schemas/employee_PunchSettings'
      required:
      - badgeNumber
      - email
      - employment
      - personalInformation
    employee_Address:
      type: object
      properties:
        address1:
          type: string
          description: Primary address line
          example: 123 Example Street
          maxLength: 50
          minLength: 0
        address2:
          type: string
          description: Secondary address line
          example: Apt 1
          maxLength: 50
          minLength: 0
        zip:
          type: string
          description: Postal or ZIP code
          example: SE-10000
          maxLength: 20
          minLength: 0
        city:
          type: string
          description: City of residence
          example: Stockholm
          maxLength: 50
          minLength: 0
        country:
          type: string
          description: Country of residence
          example: Sweden
          maxLength: 50
          minLength: 0
    employee_Employment:
      type: object
      properties:
        homeGroupId:
          type: string
          description: ID of the employee's home group
          example: '123'
        staffCategoryId:
          type: string
          description: ID of the staff category assigned to the employee
          example: '123'
        passive:
          type: boolean
          description: Whether the employee is passive
          example: false
        locked:
          type: string
          description: Lock status of the employee account
          enum:
          - NOT_LOCKED
          - LOCKED_BY_MANAGER
          - LOCKED_BY_SYSTEM
          example: NOT_LOCKED
        employmentStartDate:
          type: string
          format: date
          description: Date when the employment started
          example: '2020-01-01'
        industryStartDate:
          type: string
          format: date
          description: Date when the employee started working in the industry
          example: '2015-01-01'
        managerId:
