      x-audience: public
    delete:
      tags:
        - Tags
      summary: Delete tag
      description: Deletes the tag with the given external category and tag ID
      operationId: deleteTagByExternalId
      parameters:
        - name: categoryExternalId
          in: path
          description: External identifier of the tag category
          required: true
          schema:
            type: string
        - name: tagExternalId
          in: path
          description: External identifier of the tag to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tag successfully deleted
        '404':
          description: Tag or tag category not found
      x-audience: public
  /v2/tags/categories/{categoryExternalId}/tags:
    get:
      tags:
        - Tags
      summary: List tags by external category id
      description: >-
        Retrieves all tags associated with the specified category external
        ID.<br />Please use [GET
        /v2/categories/{categoryExternalId}/tags](#/Tag%20Integration%20API/getPagedTagsByExternalCategoryId)
        instead.<br />Removal date: December 10, 2025.
      operationId: getTagsByExternalCategoryId
      parameters:
        - name: categoryExternalId
          in: path
          description: External identifier of the tag category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of tags retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/tags_TagIntegration'
      deprecated: true
      x-audience: public
    post:
      tags:
        - Tags
      summary: Create tag
      description: >-
        Creates a new tag within the specified category. The created tag is
        returned
      operationId: createTagByExternalId
      parameters:
        - name: categoryExternalId
          in: path
          description: External identifier of the tag category
          required: true
          schema:
            type: string
      requestBody:
        description: Tag details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tags_TagIntegration'
        required: true
      responses:
        '200':
          description: Tag successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tags_TagIntegration'
      x-audience: public
  /v2/tags/v2/categories/{categoryExternalId}/tags:
    get:
      tags:
        - Tags
      summary: List paginated tags by external category id
      description: >-
        Retrieves a paginated collection of tags associated with the specified
        category external ID.<br />Pagination is defined by cursor and size.<br
        />If the cursor is omitted, the first page will be returned.<br />If the
        size is omitted, a default size of 1000 will be used
      operationId: getPagedTagsByExternalCategoryId
      parameters:
        - name: categoryExternalId
          in: path
          description: External identifier of the tag category
          required: true
          schema:
            type: string
          example: LOC-001
        - name: cursor
          in: query
          description: >-
            The reference point to fetch a set of results. If omitted or empty,
            the first page of results will be returned
          required: false
          allowEmptyValue: true
          schema:
            type: string
          example: abcdefghijklmnopqrstuvwxyz==
        - name: size
          in: query
          description: >-
            Number of items per page (default value: 1000, min value: 1, max
            value: 10000)
          required: false
          allowEmptyValue: true
          schema:
            type: integer
            default: 1000
            maximum: 10000
            minimum: 1
          example: 100
      responses:
        '200':
          description: Paged collection of tags retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tags_PagedResponse'
      x-audience: public
  /v2/tags/categories:
    get:
      tags:
        - Tags
      summary: List tag categories
      description: Retrieves a list of all tag categories associated with the domain group
      operationId: getTagCategoriesExternal
      responses:
        '200':
          description: List of tag categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/tags_TagCategory_Default'
      x-audience: public
  /v2/tags/categories/{categoryExternalId}:
    get:
      tags:
        - Tags
      summary: Get tag category by external id
      description: Retrieves a tag category using its external identifier
      operationId: getTagCategoryByExternalId
      parameters:
        - name: categoryExternalId
          in: path
          description: External identifier of the tag category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tag category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tags_TagCategory_Default'
      x-audience: public
