  /hr/v3/employees:
    get:
      tags:
      - Employee
      summary: List employees
      description: Returns a paginated list of employees.
      operationId: getEmployees
      parameters:
      - name: idIn
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
          maxItems: 50
      - name: pageToken
        in: query
        description: Cursor for the next page of results.
        required: false
        schema:
          type: string
          example: eyJpZCI6MTAwfQ
      - name: pageSize
        in: query
        description: Maximum number of items to return.
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          example: 50
          maximum: 100
          minimum: 1
