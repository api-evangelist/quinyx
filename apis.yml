aid: quinyx
name: Quinyx
description: >-
  Quinyx is an AI-powered workforce management (WFM) platform for frontline
  organizations, covering scheduling, demand forecasting, time tracking, labor
  law compliance, task management, and employee engagement across retail,
  warehousing and logistics, hospitality, facility management, and healthcare.
  Quinyx exposes a public developer platform with three APIs: the current REST
  API v3 (OAuth 2.0 client-credentials, RFC 9457 problem details, cursor
  pagination, regional EU/NA hosts), the earlier REST API v2, and a bearer-token
  User API v2, plus a legacy SOAP v1. This profile was enriched from Quinyx's
  own developer portal, OpenAPI descriptions, and public documentation.
