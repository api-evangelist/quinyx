components:
  schemas:
    employee_IntegrationEmployeeUpdateRequest:
      type: object
      properties:
        badgeNumber:
          type: string
          description: Unique badge number identifying the employee
          example: '001'
          maxLength: 20
          minLength: 0
        email:
          type: string
          format: email
          description: Employee email address
          example: employee@example.com
          maxLength: 255
          minLength: 0
        personalInformation:
          $ref: '#/components/schemas/employee_UpdatePersonalInformation'
        contactInformation:
          $ref: '#/components/schemas/employee_UpdateContactInformation'
        address:
          $ref: '#/components/schemas/employee_UpdateAddress'
        employment:
          $ref: '#/components/schemas/employee_UpdateEmployment'
        emergencyContact:
          $ref: '#/components/schemas/employee_UpdateEmergencyContact'
        punchSettings:
          $ref: '#/components/schemas/employee_UpdatePunchSettings'
      required:
        - address
        - badgeNumber
        - contactInformation
        - email
        - emergencyContact
        - employment
        - personalInformation
        - punchSettings
    employee_UpdateAddress:
      type: object
      properties:
        address1:
          type: string
          description: Primary address line
          example: 123 Example Street
          maxLength: 50
          minLength: 0
        address2:
          type: string
          description: Secondary address line
          example: Apt 1
          maxLength: 50
          minLength: 0
        zip:
          type: string
          description: Postal or ZIP code
          example: SE-10000
          maxLength: 20
          minLength: 0
        city:
          type: string
          description: City of residence
          example: Stockholm
          maxLength: 50
          minLength: 0
        country:
          type: string
          description: Country of residence
          example: Sweden
          maxLength: 50
          minLength: 0
      required:
        - address1
        - address2
        - city
        - country
        - zip
    employee_UpdateContactInformation:
      type: object
      properties:
        mobileNumber:
          type: string
          description: Employee's mobile phone number
          example: '+46700000000'
          maxLength: 20
          minLength: 0
        phoneNumber:
          type: string
          description: Employee's work phone number
          example: '+46800000000'
          maxLength: 20
          minLength: 0
      required:
        - mobileNumber
        - phoneNumber
    employee_UpdateEmergencyContact:
      type: object
      properties:
        nextOfKinName:
          type: string
          description: Name of the employee's next of kin
          example: John Doe
          maxLength: 50
          minLength: 0
        nextOfKinPhone:
          type: string
          description: Phone number of the employee's next of kin
          example: '+46700000000'
          maxLength: 20
          minLength: 0
        legalGuardianName:
          type: string
          description: Name of the employee's legal guardian
          example: Jane Doe
          maxLength: 50
          minLength: 0
        legalGuardianEmail:
          type: string
          description: Email address of the employee's legal guardian
          example: guardian@example.com
          maxLength: 50
          minLength: 0
      required:
        - legalGuardianEmail
        - legalGuardianName
        - nextOfKinName
        - nextOfKinPhone
    employee_UpdateEmployment:
      type: object
      properties:
        homeGroupId:
          type: string
          description: ID of the employee's home group
          example: '123'
          minLength: 1
        staffCategoryId:
          type: string
          description: ID of the staff category assigned to the employee
          example: '123'
        managerId:
          type: string
          description: ID of the employee's manager
          example: '1234'
        passive:
          type: boolean
          description: Whether the employee is passive
          example: false
        locked:
          type: string
          description: Lock status of the employee account
          enum:
            - NOT_LOCKED
            - LOCKED_BY_MANAGER
            - LOCKED_BY_SYSTEM
          example: NOT_LOCKED
        employmentStartDate:
          type: string
          format: date
          description: Date when the employment started
          example: '2020-01-01'
        employmentEndDate:
          type:
            - string
            - 'null'
          format: date
          description: Date when the employment ends, or `null` if employed indefinitely
          example: '2025-12-31'
        industryStartDate:
          type: string
          format: date
          description: Date when the employee started working in the industry
          example: '2015-01-01'
        costCentreId:
          type: string
          description: Cost centre ID
          example: '1234'
      required:
        - employmentStartDate
        - homeGroupId
        - industryStartDate
        - locked
        - passive
        - staffCategoryId
    employee_UpdatePersonalInformation:
      type: object
      properties:
        firstName:
          type: string
          description: Employee's first name
          example: John
          maxLength: 40
          minLength: 0
        lastName:
          type: string
          description: Employee's last name
          example: Doe
          maxLength: 40
          minLength: 0
        dateOfBirth:
          type: string
          format: date
          description: 'Employee''s date of birth '
          example: '1990-01-01'
        gender:
          type: string
          description: Employee's gender
          enum:
            - MALE
            - FEMALE
            - OTHER
            - NOT_SPECIFIED
          example: MALE
        socialSecurityNumber:
          type: string
          description: 'Employee''s social security number '
          example: 000000-0000
        pictureURL:
          type: string
          description: URL to the employee's profile picture
          example: https://example.com/pictures/placeholder.jpg
      required:
        - dateOfBirth
        - firstName
        - gender
        - lastName
        - pictureURL
        - socialSecurityNumber
    employee_UpdatePunchSettings:
      type: object
      properties:
        allowAttestOfOwnPunches:
          type: boolean
          description: Whether the employee is allowed to attest their own time punches
          example: false
      required:
        - allowAttestOfOwnPunches
