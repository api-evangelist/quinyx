          example: client_credentials
          minLength: 1
        client_id:
          type: string
          description: Client identifier
          example: my-client-id
          minLength: 1
        client_secret:
          type: string
          description: Client secret
          example: my-client-secret
          minLength: 1
        scope:
          type: string
          description: >-
            Space-delimited subset of the originally granted scopes. Allows the
            client to request a narrower set of permissions for the issued
            access token. If omitted, all originally authorized scopes apply.
          example: organization:groups:read organization:groups:create
      required:
        - client_id
        - client_secret
