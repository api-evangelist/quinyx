          example: 422
        errors:
          type: array
          description: A list of validation errors.
          items:
            $ref: '#/components/schemas/employee_ValidationErrorDetail'
          maxItems: 50
          minItems: 1
        instance:
          type: string
          description: >-
            A URI reference that identifies the specific occurrence of the
            problem.
          example: /api/endpoint
      required:
        - errors
        - status
        - title
        - type
      title: ValidationError
    employee_ValidationErrorDetail:
      type: object
      description: A single validation error.
      properties:
        detail:
          type: string
          description: >-
            A human-readable explanation specific to this occurrence of the
            problem.
          example: name is mandatory
        pointer:
          type: string
          description: >-
            A JSON Pointer [RFC6901] to the associated entity in the request
            body.
          example: '#/name'
    employee_Address:
      type: object
      properties:
        address1:
          type: string
          description: Primary address line
          example: 123 Example Street
          maxLength: 50
          minLength: 0
        address2:
          type: string
          description: Secondary address line
          example: Apt 1
          maxLength: 50
          minLength: 0
        zip:
          type: string
          description: Postal or ZIP code
          example: SE-10000
          maxLength: 20
          minLength: 0
        city:
          type: string
          description: City of residence
          example: Stockholm
          maxLength: 50
          minLength: 0
        country:
          type: string
          description: Country of residence
