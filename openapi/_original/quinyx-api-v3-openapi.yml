                - type: string
                  description: The external string ID, which must start with 'xrefId:'.
                  example: xrefId:example-external-id
                  pattern: ^xrefId:[a-zA-Z0-9._-]{1,64}$
            maxItems: 50
        - name: employeeIdIn
          in: query
          description: >-
            Filter by employeeId (IN). Supports external ids of types:
            badgeNumber
          style: form
          explode: true
          schema:
            type: array
            description: Multiple values for employeeId with operator IN
            items:
              description: >-
                An identifier that can be either a Quinyx ID or a prefixed
                external ID string.
              oneOf:
                - type: string
